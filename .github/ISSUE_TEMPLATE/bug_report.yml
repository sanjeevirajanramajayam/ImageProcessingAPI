name: 🐛 Bug Report
description: Report an issue or unexpected behavior in ImageProcessingAPI
title: "[BUG]: "
labels: ["needs-triage", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue! Please provide as much context as possible.
  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: A clear and concise description of what the bug is.
      placeholder: When transforming an image with ?format=webp, the returned content-type is...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Subsystem
      description: Which part of the system is experiencing this bug?
      options:
        - Image Processing Pipeline (Sharp / rembg)
        - Storage & S3 Adapters
        - Authentication & JWT
        - Redis Caching
        - Frontend UI
        - Docker & Deployment
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step by step guide to reproduce the issue.
      placeholder: |
        1. Send POST to `/image/upload` with sample PNG
        2. Request GET `/image/{id}/transform?format=webp`
        3. See error response code 500
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
      placeholder: Expected a 302 redirect or 200 with WebP formatted buffer.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server Logs / Console Output
      description: Paste relevant logs or stack traces here.
      render: shell
  - type: checkboxes
    id: confirmations
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
        - label: I have verified this behavior on the latest `main` branch.
          required: true
