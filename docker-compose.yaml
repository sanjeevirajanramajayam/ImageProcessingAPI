services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - 1234:1234
  backend:
    build: ./backend
    container_name: backend
    ports:
      - 4000:4000
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      PUBLIC_S3_ENDPOINT: http://localhost:9000
      DATABASE_URL: mysql://${DB_USER:-root}:${DB_PASSWORD:-1234}@db:3306/${DB_NAME:-imageprocessing}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run dev"
  db:
    image: mariadb:10.6
    container_name: mysql-db
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MARIADB_DATABASE: ${DB_NAME:-imageprocessing}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "3307:3306"
    volumes:
      - mysql_vol:/var/lib/mysql
  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio_vol:/data
    command: server /data --console-address ":9001"
  redis:
    image: redis:8.6.2-alpine
    container_name: redis
    ports:
      - "6379:6379"

volumes:
  mysql_vol:
  minio_vol:
